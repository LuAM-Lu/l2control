# CI de L2 Control — B0-4 (F1-14). En cada push y cada pull request:
# tipos → lint → arquitectura (y la demostración de que muerde) → pruebas → pruebas contra
# la base → las imágenes de producción (T-8a), que se construyen sin publicarse. Levanta PostgreSQL y Valkey con el MISMO docker-compose.yml que se usa en local,
# así que lo que pasa aquí pasa en tu máquina y al revés.
#
# Las acciones van fijadas por el hash de su commit, no por etiqueta: una etiqueta se puede
# mover y un hash no (cadena de suministro). Para subir una: nueva versión, nuevo hash.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: pnpm verify:db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # LTS (PLAN §4); engines admite más, el CI no
          cache: pnpm

      - name: Dependencias (lockfile exacto)
        run: pnpm install --frozen-lockfile

      - name: Base de datos y Valkey
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Verificar todo
        run: pnpm verify:db

      # Lo que se despliega se construye aquí también: una imagen que no construye no entra en main.
      # Publicarlas lo hace la etiqueta (publicar.yml).
      - name: Imágenes de producción (web, worker, migrar)
        run: |
          for t in web worker migrar; do
            docker build --quiet -f infra/docker/Dockerfile --target "$t" -t "l2control-$t:ci" .
          done

      - name: Registros de los contenedores si algo falló
        if: failure()
        run: docker compose logs --tail=200
